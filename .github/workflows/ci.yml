name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public repository privacy
        env:
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/test_privacy.py
          if [ -n "$PRIVACY_BASE" ]; then
            python3 scripts/check_privacy.py --range "$PRIVACY_BASE" "$PRIVACY_HEAD"
          else
            python3 scripts/check_privacy.py --head
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: uv sync --locked --dev
      - name: Compile Python sources
        run: uv run python -m compileall -q .
      - name: Lint
        run: uv run ruff check .
      - name: Run tests without credentials
        env:
          LLM_BACKEND: api
          MISTRAL_API_KEY: ""
          OTEL_ENABLED: "false"
        run: uv run pytest -q
      - name: Run deterministic evaluation contract
        run: uv run python -m evals.run_evals
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-hashes --output-file /tmp/audit-requirements.txt
          uv run pip-audit --requirement /tmp/audit-requirements.txt --strict --progress-spinner off
